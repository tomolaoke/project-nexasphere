[server]
headless = true
port = 8501

# Light, lavender-tinted product theme (see src/ordino/theme.py for the
# full design system). Streamlit's own widgets pick these up; everything else
# is styled by the injected CSS.
[theme]
base = "light"
primaryColor = "#5B4FE9"
backgroundColor = "#F5F4FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#14142B"
font = "sans serif"
